<!doctype html><html><head><meta charset="utf-8"><title>XRP Profile Mapper</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>XRP Profile Mapper</h1><button id="connect">Connect to XRP</button><button id="detach" type="button" title="Open in separate window" aria-label="Open in separate window">↗</button></header>
<p id="status" role="status" aria-live="polite"></p>
<p id="account">Not connected</p><button id="capture">Capture LinkedIn profile</button>
<form id="profile"><fieldset id="destination"><legend>Import destination</legend><label>Import to<select id="destinationMode"><option value="search" selected>Into a search</option><option value="directory">Candidate directory only</option></select></label><div id="searchDestination"><label>Find search<input id="searchQuery" type="search" placeholder="Type search name, client or ID"></label><select id="search" hidden aria-label="Selected search"><option value="">Choose a search…</option></select><div id="searchResults" aria-label="Matching searches"></div></div><p id="destinationSummary">Choose a search before importing.</p></fieldset><div id="fields"></div><details id="contactDetails"><summary>Contact details (optional)</summary><div id="contacts"></div></details>
</form>
<section id="review" hidden><h2>Candidate match</h2><p id="reviewDestination"></p><p id="matchInfo"></p><label>Candidate<select id="candidateMatch"></select></label><label class="check"><input type="checkbox" id="newCandidate">Create a different candidate</label><label>Company<select id="companyMatch"></select></label><label class="check"><input type="checkbox" id="newCompany">Create a different company</label><button id="import">Import into XRP</button></section>
<a id="open" target="_blank" rel="noopener" hidden>Open XRP</a><button id="clear">Clear profile</button>
<script src="popup.js"></script></body></html>
