name: Deploy XQtiv Search Operations
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Connect private backup storage
        id: backup-storage
        run: node scripts/provision-backup-storage.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_ERP_CLOUDFARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --config "${{ steps.backup-storage.outputs.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_ERP_CLOUDFARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
